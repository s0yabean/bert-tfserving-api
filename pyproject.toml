[project]
name = "bert-tfserving-api"
version = "2026.1.0"
description = "Flask API in front of TensorFlow Serving for a BERT text classifier (2021 pattern, revisited)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's classic defaults (pyflakes + pycodestyle errors) plus bugbear.
select = ["E4", "E7", "E9", "F", "B"]
# zip(a, a[1:]) and similar pairings are deliberately uneven; strict= would break them.
ignore = ["B905"]
